# HVFalseLean — Lean 4 formalization of the paper "The Hollenbeck-Verbitsky (2010) conjecture is false"
# Copyright (C) Dave Goel 2026--now. All rights reserved.
name = "HVFalseLean"
version = "0.1.0"
defaultTargets = ["HVFalse"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "HVFalse"
globs = ["HVFalse", "HVFalse.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
weakLeanArgs = ["-j1"]
